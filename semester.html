      var q = [];
      ["year"].forEach(function (k) {
        if (p.has(k)) q.push(k + "=" + encodeURIComponent(p.get(k)));
      });
      var c = document.createElement("link");
      c.rel = "canonical";
      c.href = "https://rtunotes.in" + window.location.pathname + (q.length ? "?" + q.join("&") : "");
      document.head.appendChild(c);
    })();
  </script>
